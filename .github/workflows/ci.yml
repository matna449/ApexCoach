name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APEX_ENCRYPTION_KEY: test-ci-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=apex_coach --cov-report=term-missing --cov-fail-under=80

  postgres:
    runs-on: ubuntu-latest
    env:
      APEX_ENCRYPTION_KEY: test-ci-key
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Round-trip migrations with the alembic command
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apex_test
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Run postgres tests
        env:
          APEX_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/apex_test
        run: |
          pytest -m postgres --run-postgres
