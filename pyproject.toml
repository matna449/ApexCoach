# What the Vercel function installs: Vercel reads this before requirements.txt,
# which stays the full list for local development and tests. CI's `vercel-deps`
# job imports the app with only these packages.
[project]
name = "apex-coach"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42.0",
    "click>=8.1",
    "psycopg[binary]>=3.2",
    "SQLAlchemy>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.115",
]

[tool.vercel]
entrypoint = "web.backend.main:app"

[tool.pytest.ini_options]
testpaths = ["apex_coach/tests"]
pythonpath = ["."]
markers = [
    "live_llm: requires a running local Ollama instance with llama3.1:8b pulled; skipped by default, run with --run-live-llm",
    "postgres: requires a throwaway Postgres database in APEX_TEST_POSTGRES_URL, which gets wiped; skipped by default, run with --run-postgres",
]

[tool.coverage.run]
source = ["apex_coach"]
omit = ["apex_coach/tests/*"]
